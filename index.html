<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>K2 소총 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg1:#ffffff; --bg2:#e4e8ee; --fg:#141a24; --muted:#5d6878; --line:rgba(20,30,50,.08);
          --chip:rgba(255,255,255,.78); --chip-solid:#fff; --hover:rgba(20,30,50,.06); --on:#151b26; --on-fg:#fff;
          --warn:#c2410c; --ok:#15803d; --fire:#c81e1e; --fire2:#8f1212; --accent:#2563eb;
          --shadow:0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.10); --r:16px; }
  body.range { --chip:rgba(17,22,30,.62); --chip-solid:#11161e; --fg:#eef2f7; --muted:#a8b3c2; --line:rgba(255,255,255,.10); --hover:rgba(255,255,255,.08);
               --on:#eef2f7; --on-fg:#111827; --warn:#fdba74; --ok:#86efac; --shadow:0 6px 24px rgba(0,0,0,.35); }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html, body, button { touch-action:manipulation; }
  html, body { margin:0; height:100%; overflow:hidden; background:#fff; color-scheme:light; }
  body { background: radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2) 75%); color:var(--fg);
         font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; letter-spacing:-.01em; }
  body.range { background: linear-gradient(#8dbde6, #dcecf8 60%, #eef4f8); }
  canvas { display:block; touch-action:none; }
  .glass { background:var(--chip); border:1px solid var(--line); box-shadow:var(--shadow); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4); }
  kbd { font:600 10px ui-monospace, "SF Mono", Consolas, monospace; color:var(--muted); background:var(--chip-solid); border:1px solid var(--line);
        border-bottom-width:2px; border-radius:5px; padding:0 5px; line-height:15px; display:inline-block; min-width:16px; text-align:center; }
  #hud { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
  /* ammo card (top left) */
  #ammoCard { padding:10px 14px 11px; border-radius:var(--r); min-width:150px; }
  #ammoCard .cap { font-size:10.5px; font-weight:800; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  #ammo { font-size:40px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; margin-top:4px; letter-spacing:-.03em; }
  #ammo small { font-size:20px; color:var(--muted); font-weight:700; letter-spacing:0; }
  #ammoBar { margin-top:8px; height:6px; border-radius:6px; background:var(--hover); overflow:hidden; }
  #ammoBar i { display:block; height:100%; width:100%; border-radius:6px; background:linear-gradient(90deg, #c08a2e, #e3b45a); transition:width .18s ease; }
  #ammoBar.low i { background:linear-gradient(90deg, #b91c1c, #ef4444); }
  #ammoLbl { font-size:12px; color:var(--muted); margin-top:7px; font-weight:600; }
  /* status guide: top centre under the view switch */
  #status { position:fixed; top:calc(70px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); max-width:min(640px, calc(100vw - 380px));
            padding:10px 20px 10px 16px; border-radius:var(--r); font-size:17px; font-weight:650; line-height:1.38; text-align:center; pointer-events:none; text-wrap:balance; }
  #status:empty { display:none; }
  #status::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 10px 2px 0; vertical-align:middle; background:currentColor;
                    box-shadow:0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); }
  #status.warn { color:var(--warn); } #status.ok { color:var(--ok); }
  #status.pulse { animation:pulse .35s ease-out; }
  @keyframes pulse { from { opacity:.3; transform:translate(-50%, -4px); } to { opacity:1; transform:translate(-50%, 0); } }
  /* selector / gas / score (top right) */
  #right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  #selCard { padding:6px 6px 6px 12px; border-radius:999px; display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #selCard .cap, #gasChip .cap { font-size:10.5px; font-weight:800; color:var(--muted); letter-spacing:.08em; }
  #sel { display:flex; gap:2px; cursor:pointer; }
  #sel span { padding:6px 12px; border-radius:999px; font-size:13px; font-weight:750; color:var(--muted); white-space:nowrap; transition:background .15s, color .15s; }
  #sel span:hover { background:var(--hover); }
  #sel span.on { background:var(--on); color:var(--on-fg); }
  #sel span.on.safe { background:var(--ok); color:#fff; }
  body.range #sel span.on.safe { color:#052e16; }
  #score { font-size:13px; font-weight:750; text-align:right; padding:7px 13px; border-radius:12px; }
  #score[hidden], #zeroCard[hidden] { display:none; }
  #zeroCard { position:fixed; left:16px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:2; padding:10px 12px; border-radius:var(--r); min-width:224px; }
  #zeroCard .cap { font-size:10.5px; font-weight:800; color:var(--muted); letter-spacing:.08em; margin-bottom:6px; display:flex; gap:4px; align-items:center; }
  #zeroCard .cap kbd:first-of-type { margin-left:auto; }
  .zrow { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:12.5px; font-weight:700; }
  .zrow span { flex:1; }
  .zrow b { min-width:44px; text-align:center; font-variant-numeric:tabular-nums; font-size:13px; }
  #zeroCard button { border:1px solid var(--line); background:var(--hover); color:var(--fg); font:inherit; font-weight:750; border-radius:9px; cursor:pointer; }
  .zrow button { width:30px; height:28px; font-size:12px; }
  #zNew { width:100%; margin-top:6px; padding:7px; font-size:12.5px; display:flex; gap:6px; justify-content:center; align-items:center; }
  #zeroCard button:active { transform:scale(.95); }
  .chip { pointer-events:auto; cursor:pointer; font-size:12.5px; font-weight:750; padding:7px 13px; border-radius:999px; display:flex; gap:7px; align-items:center; }
  .chip:hover { filter:brightness(.98); }
  #hud, #status, #viewSeg, #dock, #fire, #hint, #pop { z-index:2; }
  #peep { position:fixed; inset:0; pointer-events:none; display:none; z-index:1;
          background: radial-gradient(circle at 50% 50%, transparent 0, transparent 21vmin, rgba(18,20,24,.55) 25vmin, rgba(12,13,16,.94) 31vmin); }
  body.range #peep { display:none; }   /* (user) no dark tunnel round the sights */
  #pop { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); font-size:40px; font-weight:900; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.45); opacity:0; pointer-events:none; }
  #pop.go { animation:pop .8s ease-out; }
  #rangeMsg { position:fixed; left:50%; top:66%; transform:translate(-50%, 8px); z-index:3; padding:12px 22px; border-radius:var(--r); font-size:18px; font-weight:750;
              color:var(--warn); pointer-events:none; opacity:0; transition:opacity .2s, transform .2s; max-width:calc(100vw - 40px); text-align:center; }
  #rangeMsg.on { opacity:1; transform:translate(-50%, 0); }
  body:not(.range) #rangeMsg { display:none; }
  /* press-and-hold progress (stock fold) */
  #holdRing { position:fixed; z-index:3; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; pointer-events:none; --p:0%;
              background:conic-gradient(var(--accent) var(--p), rgba(255,255,255,.55) 0); box-shadow:var(--shadow); display:grid; place-items:center; }
  #holdRing[hidden] { display:none; }
  #holdRing span { width:44px; height:44px; border-radius:50%; background:var(--chip-solid); display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--fg); }
  @keyframes pop { 0% { opacity:1; transform:translate(-50%,-30%) scale(1.2); } 70% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-90%) scale(1); } }
  /* view switch (top centre) */
  #viewSeg { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); display:flex; gap:2px; padding:4px; border-radius:999px; }
  #viewSeg button { border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:750; color:var(--muted); padding:8px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
                    display:flex; gap:6px; align-items:center; transition:background .15s, color .15s; }
  #viewSeg button:hover { background:var(--hover); }
  #viewSeg button.on { background:var(--on); color:var(--on-fg); }
  #viewSeg svg, .tile svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  #viewSeg svg { width:16px; height:16px; }
  /* tool dock (right edge): action / attachments / view */
  #dock { position:fixed; right:14px; top:50%; transform:translateY(-50%); display:grid; grid-template-columns:repeat(2, 66px); gap:3px; padding:8px;
          border-radius:20px; max-height:calc(100vh - 230px); overflow-y:auto; scrollbar-width:none; }
  #dock::-webkit-scrollbar { display:none; }
  #dock .grp, #dock .sep { grid-column:1 / -1; }
  #dock .grp { font-size:9.5px; font-weight:800; color:var(--muted); text-align:center; letter-spacing:.12em; margin:4px 0 1px; }
  #dock .grp:first-child { margin-top:2px; }
  #dock .sep { height:1px; background:var(--line); margin:4px 6px 0; }
  .tile { position:relative; width:66px; min-height:54px; border:0; border-radius:13px; background:transparent; cursor:pointer; font:inherit; color:var(--fg);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:7px 2px 6px; transition:background .15s, color .15s, transform .08s; }
  .tile b { font-size:11.5px; font-weight:750; line-height:1.15; text-align:center; }
  .tile kbd { position:absolute; top:4px; right:4px; font-size:8.5px; line-height:11px; min-width:13px; padding:0 3px; border-bottom-width:1px; opacity:.85; }
  .tile:hover { background:var(--hover); }
  .tile:active { transform:scale(.96); }
  .tile.on { background:var(--on); color:var(--on-fg); }
  .tile.on kbd { color:var(--on-fg); background:transparent; border-color:rgba(255,255,255,.35); }
  body.range .tile.on kbd { border-color:rgba(0,0,0,.25); }
  /* fire button (bottom right) */
  #fire { position:fixed; right:22px; bottom:calc(24px + env(safe-area-inset-bottom)); width:88px; height:88px; border-radius:50%; border:0;
          background:radial-gradient(circle at 35% 30%, #ef4444, var(--fire) 55%, var(--fire2)); color:#fff; font:inherit; font-size:17px; font-weight:850; cursor:pointer;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
          box-shadow:0 0 0 5px rgba(255,255,255,.55), 0 10px 26px rgba(185,28,28,.42); transition:transform .08s; }
  body.range #fire { box-shadow:0 0 0 5px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.45); }
  #fire kbd { color:#fff; background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.3); }
  #fire:active { transform:scale(.93); }
  /* key guide (bottom) */
  #hint { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); max-width:calc(100vw - 300px);
          display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; padding:8px 14px; border-radius:14px; font-size:12px; color:var(--muted); pointer-events:none; font-weight:600; }
  #hint span { white-space:nowrap; display:inline-flex; gap:5px; align-items:center; }
  #hint:empty { display:none; }
  body.touch kbd { display:none; }
  body.touch #hint span kbd { display:inline-block; }
  @media (max-width: 640px) {
    #hud { left:10px; right:10px; }
    #ammoCard { padding:8px 11px 9px; min-width:118px; }
    #ammo { font-size:30px; } #ammo small { font-size:15px; }
    #ammoLbl { font-size:11px; }
    #status { top:calc(118px + env(safe-area-inset-top)); max-width:calc(100vw - 20px); font-size:14.5px; padding:8px 14px 8px 12px; }
    #selCard { padding:4px 4px 4px 9px; gap:4px; } #selCard .cap { display:none; }
    #sel span { padding:5px 8px; font-size:12px; }
    #viewSeg { top:auto; bottom:calc(20px + env(safe-area-inset-bottom)); left:10px; transform:none; }
    #viewSeg button { padding:9px 12px; }
    /* phones: the dock becomes a swipeable row above the view switch, clear of the rifle */
    #dock { top:auto; transform:none; left:8px; right:104px; bottom:calc(78px + env(safe-area-inset-bottom)); display:flex; flex-direction:row; align-items:center;
            max-height:none; overflow-x:auto; overflow-y:hidden; padding:5px; border-radius:18px; }
    #dock .grp, #dock .sep { display:none; }
    .tile { width:auto; min-width:62px; min-height:52px; flex:0 0 auto; padding:5px 9px; }
    .tile kbd { display:none; }
    .tile b { font-size:11.5px; white-space:nowrap; }
    .tile b br { display:none; }
    #fire { width:80px; height:80px; right:12px; bottom:calc(20px + env(safe-area-inset-bottom)); }
    #hint { display:none; }
    #zeroCard { left:10px; bottom:auto; top:calc(126px + env(safe-area-inset-top)); min-width:0; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="ammoCard" class="glass">
    <div class="cap">K2 · 5.56mm</div>
    <div id="ammo">30<small> + 0</small></div>
    <div id="ammoBar"><i></i></div>
    <div id="ammoLbl">탄창 + 약실</div>
  </div>
  <div id="right">
    <div id="selCard" class="glass" title="조정간 (Q)"><span class="cap">조정간</span><div id="sel"><span>안전</span><span>단발</span><span>연발</span><span>점사</span></div></div>
    <div id="gasChip" class="chip glass" title="가스조절기 (G)"></div>
    <div id="score" class="glass" hidden></div>
  </div>
</div>
<div id="status" class="glass"></div>
<div id="zeroCard" class="glass" hidden>
  <div class="cap">영점 조정 <kbd>←→</kbd><kbd>↑↓</kbd></div>
  <div class="zrow"><span>가늠자돌림쇠</span><button data-z="w,-1" title="탄착 왼쪽으로">◀</button><b id="zW">0</b><button data-z="w,1" title="탄착 오른쪽으로">▶</button></div>
  <div class="zrow"><span>상하조정나사</span><button data-z="e,-1" title="탄착 아래로">▼</button><b id="zE">0</b><button data-z="e,1" title="탄착 위로">▲</button></div>
  <button id="zNew">표적지 교체 <kbd>T</kbd></button>
</div>

<div id="peep"></div>
<div id="pop"></div>
<div id="rangeMsg" class="glass"></div>
<div id="holdRing" hidden><span>꾹</span></div>
<div id="viewSeg" class="glass"><button data-v="inspect" class="on"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>점검</button><button data-v="range"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>사격장</button></div>
<div id="dock" class="glass">
  <div class="grp">조작</div>
  <button class="tile" id="bCharge"><svg viewBox="0 0 24 24"><path d="M4 12h11"/><path d="M11 8l4 4-4 4"/><path d="M19 6v12"/></svg><b>노리쇠</b><kbd>F</kbd></button>
  <button class="tile" id="bCatch"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="7" rx="3"/><path d="M12 10v11"/><path d="M9 21h6"/></svg><b>노리쇠멈치</b><kbd>C</kbd></button>
  <button class="tile" id="bMag"><svg viewBox="0 0 24 24"><path d="M8 3h8l1 8-1.5 10h-6L8 11z"/><path d="M9 7h6"/></svg><b>탄창 분리</b><kbd>R</kbd></button>
  <button class="tile" id="bNew"><svg viewBox="0 0 24 24"><path d="M7 3h7l1 7-1.5 10h-5L7 10z"/><path d="M19 4v6M16 7h6"/></svg><b>새 탄창</b><kbd>N</kbd></button>
  <div class="sep"></div><div class="grp">부착</div>
  <button class="tile" id="bBay"><svg viewBox="0 0 24 24"><path d="M3 21l7-7"/><path d="M10 14l10-10-1 6-6 7z"/><path d="M7 14l3 3"/></svg><b>대검</b><kbd>B</kbd></button>
  <button class="tile" id="bStock"><svg viewBox="0 0 24 24"><path d="M3 9h9l3-3h6v10h-6l-3-3H3z"/></svg><b>개머리판</b><kbd>V</kbd></button>
  <button class="tile" id="bSling"><svg viewBox="0 0 24 24"><path d="M3 6c4 10 14 10 18 0"/><path d="M3 4v4M21 4v4"/></svg><b>멜빵</b><kbd>M</kbd></button>
  <div class="sep"></div><div class="grp">보기</div>
  <button class="tile" id="bClear"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><b>투명</b><kbd>X</kbd></button>
  <button class="tile" id="bDis"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><b>분해</b><kbd>D</kbd></button>
</div>
<button id="fire"><span>발사</span><kbd>Space</kbd></button>
<div id="hint" class="glass"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, (innerWidth/innerHeight) || 1.6, 0.05, 2000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 3; controls.maxDistance = 60;

(function buildEnv(){
  const env = new THREE.Scene();
  const skyGeo = new THREE.SphereGeometry(50, 32, 16);
  const cols = [], pos = skyGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const h = THREE.MathUtils.smoothstep(pos.getY(i)/50, -0.4, 0.8);
    const c = new THREE.Color(0x141619).lerp(new THREE.Color(0x8c939e), h);
    cols.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  env.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side:THREE.BackSide, vertexColors:true })));
  const lightMat = new THREE.MeshBasicMaterial({ color:0xffffff });
  [[0,30,0, 30,1,10],[25,10,10, 1,14,20],[-25,8,-8, 1,10,14],[0,6,-28, 18,8,1],[0,18,14, 60,1.2,2],[0,-6,20, 60,0.8,1.5]].forEach(([x,y,z,w,h,d])=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), lightMat); b.position.set(x,y,z); env.add(b);
  });
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3d44, 0.3));
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7); rim.position.set(-12, 8, -14); scene.add(rim);
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(6, 20, 14); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left:-12, right:12, top:12, bottom:-12, near:1, far:60 });
scene.add(key, key.target);

// ---------- materials ----------
// procedural surface textures: parkerized grain on the metal, fine stipple on polymer, checkering on the grip
function noiseTex(base, amp, rep, size=256){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  for (let i=0;i<img.data.length;i+=4){ const v = base + (Math.random()*2-1)*amp; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
}
function checkerTex(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#202020'; g.lineWidth = 3;

  const n = Math.min(count, parts.magRounds.length), { MTOP, MBOT, MSTEP } = parts;

  parts.follower.position.set(parts.magRear(fy) + parts.MDEP/2, fy, 0);
  parts.follower.rotation.z = Math.atan(parts.magSlope(fy)) + 0.04;

}

}

}
function pullTrigger(){
  if (S.trigger) return; S.trigger = true;

// charging handle: fully back extracts (and cocks); letting go strips the next round into the chamber
function chargeExtract(){
  if (S.extracted) return; S.extracted = true; S.cocked = true;

}
// bolt hold-open. An empty magazine's follower pushes the catch, so the carrier stays back after the last round

// Release: press the catch, or pull the handle back a little and let go; the carrier runs home and chambers a round.
const emptyMagSeated = () => S.mag && S.attached && S.magOut < 0.02 && S.mag.count === 0;
function lastRoundHold(){ if (!emptyMagSeated()) return false; S.held = true; S.burst = 0; SND.bolt(0.4); say('마지막 탄 — 노리쇠 후퇴고정됨'); return true; }
function releaseHold(){
  if (!S.held) return false;

}
function boltCatch(){
  if (S.disasm || S.ex > 0.05){ say('분해 상태예요 — 조립 후 사용 (D)'); return; }

  S.catchPulled = !S.catchPulled; SND.safe();

}
function chargeRelease(){
  if (S.catchPulled && S.extracted){ S.held = true; S.catchPulled = false; S.extracted = false; S.dragging = false; SND.bolt(0.4); say('노리쇠 후퇴고정'); renderHud(); return; }

// ---------- shooting at the target ----------
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function shootTarget(){
  S.rangeShots++;
  aim.updateMatrixWorld(true);
  camera.getWorldPosition(tmpA);
  const dir = tmpB.set(1, 0, 0).applyQuaternion(aim.getWorldQuaternion(new THREE.Quaternion()));
  const spread = 0.0012 + Math.min(0.012, S.streak*0.0018);
  dir.add(new THREE.Vector3(0, (Math.random()-0.5)*2*spread, (Math.random()-0.5)*2*spread)).normalize();
  aimKick += 0.022 + (S.fold > 0.5 ? 0.01 : 0); aimYawT += (Math.random() - 0.5)*0.008; camShake = 1;   // muzzle climb, a little sideways, and the shoulder jolt
  if (Math.abs(dir.x) < 1e-4) return;
  const t = (TARGET_X - tmpA.x) / dir.x; if (t <= 0) return;
  const lp = target.worldToLocal(tmpA.clone().addScaledVector(dir, t));
  lp.y -= ZERO_UP*TCV.CELL/TCV.H*TH;                          // aimed at the dot, a zeroed rifle strikes the zero point
  lp.x += (S.zx + S.wind)*TCV.CELL/TCV.W*TW; lp.y += (S.zy + S.elev)*TCV.CELL/TCV.H*TH;   // this rifle's error + the sight clicks
  if (Math.abs(lp.x) > TW/2 || Math.abs(lp.y) > TH/2){ popScore('빗나감'); return; }
  const u = (lp.x/TW + 0.5)*TCV.W, v = (0.5 - lp.y/TH)*TCV.H;
  const g = targetCanvas.getContext('2d');
  // 5.56 hole: torn grey rim round a dark hole
  g.fillStyle = 'rgba(90,90,90,.55)'; g.beginPath(); for (let k=0;k<10;k++){ const a = k/10*Math.PI*2, r = 9 + Math.random()*4; k ? g.lineTo(u + Math.cos(a)*r, v + Math.sin(a)*r) : g.moveTo(u + Math.cos(a)*r, v + Math.sin(a)*r); } g.closePath(); g.fill();
  g.fillStyle = '#121212'; g.beginPath(); g.arc(u, v, 6.5, 0, Math.PI*2); g.fill();
  targetTex.needsUpdate = true;
  // offset from the zero point in grid cells → which way to adjust (as printed on the sheet)
  const dx = (u - TCV.X0)/TCV.CELL, dy = (TCV.Y0 - v)/TCV.CELL, inside = Math.hypot(dx, dy) <= ZERO_R;
  if (inside){ S.hits++; popScore('원 안 명중'); }
  else popScore(`${dx < 0 ? '좌' : '우'} ${Math.abs(dx).toFixed(1)} · ${dy > 0 ? '상' : '하'} ${Math.abs(dy).toFixed(1)}칸`);
  // 3-round group: its centre tells how many clicks to put on (sheet: 좌탄 → 돌림쇠 우로, 상탄 → 상하조정나사 좌로)
  S.group.push([dx, dy]);
  if (S.group.length >= 3){
    const mx = S.group.reduce((a, g)=>a + g[0], 0)/S.group.length, my = S.group.reduce((a, g)=>a + g[1], 0)/S.group.length;
    S.group = []; drawGroupMark(mx, my);
    const wc = Math.round(-mx), ec = Math.round(-my);
    if (Math.hypot(mx, my) <= 1.0) say('3발 탄착군 중심이 영점 원 안 — 영점 잡힘!', 6);
    else say(`3발 탄착군: ${mx < 0 ? '좌' : '우'} ${Math.abs(mx).toFixed(1)} · ${my > 0 ? '상' : '하'} ${Math.abs(my).toFixed(1)}칸 → ` +
      [wc ? `돌림쇠 ${wc > 0 ? '우로' : '좌로'} ${Math.abs(wc)}클릭` : '', ec ? `상하조정나사 ${ec > 0 ? '우로' : '좌로'} ${Math.abs(ec)}클릭` : ''].filter(Boolean).join(' · '), 8);
  }
}
// mark the group centre on the sheet (small cross)
function drawGroupMark(mx, my){
  const g = targetCanvas.getContext('2d'), x = TCV.X0 + mx*TCV.CELL, y = TCV.Y0 - my*TCV.CELL;
  g.strokeStyle = '#1d4ed8'; g.lineWidth = 4; g.beginPath(); g.moveTo(x - 14, y); g.lineTo(x + 14, y); g.moveTo(x, y - 14); g.lineTo(x, y + 14); g.stroke();

}
// one click of the windage drum (+1 = strike moves right) or the elevation screw (+1 = strike moves up)
function zeroClick(axis, d){

  ac();
  if (view === 'range'){
    cvs.setPointerCapture(e.pointerId);
    if (e.pointerType === 'mouse'){ active = 'trigger'; pullTrigger(); }
    else touchAim = { x:e.clientX, y:e.clientY, yaw:aimYawT, pitch:aimPitchT };
    return;
  }
  if (pickCasing(e)) return;
  aimRay(e);
  const hit = pickGun();
  if (!hit) return;
  controls.enabled = false; cvs.setPointerCapture(e.pointerId);
  const part = hit.object.userData.part;
  if (S.disasm && (part === 'bcg' || part === 'handle')){ active = 'ui'; if (S.disasm === 1) toggleDisasm(); }
  else if (part === 'handle' && !S.disasm){
    active = 'handle'; S.dragging = true; S.cycle = null; S.charging = null;
    S.extracted = S.held; S.held = false;          // grabbing the handle takes the carrier off the catch; letting go sends it home
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), hit.point);
    dragX0 = rec.worldToLocal(hit.point.clone()).x; dragC0 = S.carrier;
  } else if (part === 'selector'){ active = 'ui'; cycleSelector(); }
  else if (part === 'boltcatch'){ active = 'ui'; boltCatch(); }
  else if (part === 'latch' && !S.disasm){ active = 'ui'; toggleDisasm(); }
  else if (part === 'rearsight'){ active = 'ui'; toggleFlip(); }
  else if (part === 'nightsight'){ active = 'ui'; toggleNight(); }
  else if (part === 'zeroW'){ active = 'ui'; zeroClick('w', e.shiftKey ? -1 : 1); }
  else if (part === 'zeroE'){ active = 'ui'; zeroClick('e', e.shiftKey ? -1 : 1); }
  else if (part === 'mag'){ active = 'ui'; toggleMag(); }
  else if (part === 'stock'){ active = 'stockHold'; startStockHold(e.clientX, e.clientY); }
  else if (part === 'bayonet'){ active = 'ui'; toggleBayonet(); }
  else if (part === 'sling'){ active = 'ui'; toggleSling(); }
  else if (part === 'gas'){ active = 'ui'; cycleGas(); }
  else { active = 'trigger'; pullTrigger(); }
});
cvs.addEventListener('pointermove', e=>{
  if (view === 'range'){
    if (e.pointerType === 'mouse'){
      aimYawT = -(e.clientX/innerWidth*2-1) * 0.28; aimPitchT = -(e.clientY/innerHeight*2-1) * 0.16;
    } else if (touchAim){
      aimYawT = THREE.MathUtils.clamp(touchAim.yaw - (e.clientX - touchAim.x)/innerWidth * 0.5, -0.35, 0.35);
      aimPitchT = THREE.MathUtils.clamp(touchAim.pitch - (e.clientY - touchAim.y)/innerHeight * 0.35, -0.2, 0.2);
    }
    return;
  }
  if (active === 'handle'){
    aimRay(e);
    if (ray.ray.intersectPlane(dragPlane, tmpA)){
      const x = rec.worldToLocal(tmpA.clone()).x;
      S.carrier = THREE.MathUtils.clamp(dragC0 - (x - dragX0), 0, TRAVEL);
      if (S.carrier > TRAVEL*0.92) chargeExtract();
    }
    return;
  }
  if (!active){
    aimRay(e);
    const hit = pickGun(), p = hit && hit.object.userData.part;
    cvs.style.cursor = !hit ? 'grab' : p === 'handle' ? 'ew-resize' : 'pointer';
  }
});
function endPointer(){
  if (active === 'trigger') releaseTrigger();
  if (active === 'handle') chargeRelease();
  if (active === 'stockHold') endStockHold();
  active = null; touchAim = null;
  if (view === 'inspect') controls.enabled = true;
}
cvs.addEventListener('pointerup', endPointer);
cvs.addEventListener('pointercancel', endPointer);

const fireBtn = document.getElementById('fire');

document.getElementById('bCharge').onclick = ()=>{ ac(); chargeAuto(); };

{ const b = document.getElementById('bStock');
  b.addEventListener('pointerdown', e=>{ ac(); const r = b.getBoundingClientRect(); startStockHold(r.left + r.width/2, r.top + r.height/2); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev=>b.addEventListener(ev, endStockHold)); }

[...selEl.children].forEach((s, i)=>s.onclick = ()=>{ ac(); setSelector(i); });

addEventListener('keydown', e=>{
  if (e.repeat){ if (e.code === 'Space') e.preventDefault(); return; }
  ac();
  switch (e.code){
    case 'Space': e.preventDefault(); pullTrigger(); break;
    case 'KeyQ': cycleSelector(); break;
    case 'KeyF': chargeAuto(); break;
    case 'KeyC': boltCatch(); break;
    case 'KeyE': toggleFlip(); break;
    case 'KeyY': toggleNight(); break;
    case 'KeyR': toggleMag(); break;
    case 'KeyN': newMag(); break;
    case 'KeyV': startStockHold(innerWidth/2, innerHeight/2); break;
    case 'KeyX': toggleClear(); break;
    case 'KeyB': toggleBayonet(); break;
    case 'KeyM': toggleSling(); break;
    case 'KeyG': cycleGas(); break;
    case 'KeyD': toggleDisasm(); break;
    case 'ArrowRight': e.preventDefault(); zeroClick('w', 1); break;

addEventListener('keyup', e=>{ if (e.code === 'Space'){ e.preventDefault(); releaseTrigger(); } if (e.code === 'KeyV') endStockHold(); });
addEventListener('contextmenu', e=>e.preventDefault());
['gesturestart', 'gesturechange'].forEach(t=>document.addEventListener(t, e=>e.preventDefault()));
document.addEventListener('dblclick', e=>e.preventDefault(), { passive:false });

// ---------- loop ----------
const clock = new THREE.Clock();
const MAG_DIR = new THREE.Vector3(0.12, -1, 0).normalize();
const PORT0 = -0.12, PORT1 = 1.04;     // ejection port span (x)
let hudT = 0;
// field-strip timeline helpers: eased 0→1 progress of S.ex through [a, b], and summing [a, b, offset] steps onto a vector
function stepK(a, b){ const x = THREE.MathUtils.clamp((S.ex - a)/(b - a), 0, 1); return x*x*(3 - 2*x); }
function applySteps(v, steps){ steps.forEach(([a, b, d])=>{ const k = stepK(a, b); v.x += d[0]*k; v.y += d[1]*k; v.z += d[2]*k; }); }
function animate(){
  const dt = Math.min(clock.getDelta(), 1/30), t = clock.elapsedTime;

  // burst / automatic fire
  S.cooldown -= dt;
  if (S.cooldown <= 0){
    if (S.burst > 0){ S.burst--; fire(); }
    else if (S.selector === AUTO && S.trigger && S.chambered && S.cocked) fire();
  }
  if (S.cycle){
    // gas cycle: carrier slams back (decelerating against the spring), then the spring drives it home
    const c = S.cycle; c.t += dt;
    const u = c.t/c.dur, BACK = 0.4;
    if (u < BACK){ const k = u/BACK; S.carrier = TRAVEL*(1 - (1 - k)*(1 - k)); }
    else {
      if (!c.fed){ c.fed = true; SND.bolt(0.25); if (lastRoundHold()){ S.cycle = null; S.carrier = TRAVEL; renderHud(); } else if (canFeed()) feedFromMag(); }
      const k = Math.min(1, (u - BACK)/(1 - BACK)); S.carrier = TRAVEL*(1 - k*k);
    }
    if (S.cycle && u >= 1){ S.carrier = 0; S.carrierV = 0; S.cycle = null; }
  } else if (S.charging){
    // manual charge (F / button): a quick snatch back, then let go
    const back = 0.09;
    S.charging.t += dt;
    S.carrier = Math.min(TRAVEL, S.charging.t/back*TRAVEL);
    if (S.carrier >= TRAVEL){ chargeExtract(); if (S.charging.t > back + 0.03){ chargeRelease(); S.charging = null; } }
  } else if (S.held){
    S.carrier = TRAVEL;                // caught by the bolt catch
  } else if (!S.dragging){
    const k = 2500;                   // spring snaps the carrier home
    for (let i=0;i<4;i++) [S.carrier, S.carrierV] = spring(S.carrier, S.carrierV, 0, k, 2*Math.sqrt(k)*1.05, dt/4);
    if (S.carrier < 0) S.carrier = 0;
  }
  if (S.carrier > 0.3) S.cocked = true;
  if (S.ex > 0.05) S.carrier = 0;
  parts.carrier.position.set(-S.carrier, 0, 0); applySteps(parts.carrier.position, parts.CARRIER_STEPS);
  // recoil spring compresses as the carrier comes back
  parts.recoilSpring.scale.y = Math.max(0.3, 2.86 - S.carrier);   // supporter (x -1.06) to the stop inside the op-rod tube (x 1.8 - carrier)
  // bolt strip in the port (opaque mode): the part of the carrier/bolt (x 0.12…1.29) that is behind the port
  const b0 = 0.12 - S.carrier, b1 = 1.29 - S.carrier, lo = Math.max(b0, PORT0), hi = Math.min(b1, PORT1);
  parts.bolt.visible = false; parts.bolt.scale.x = Math.max(0.001, (hi - lo)/0.85); parts.bolt.position.x = (lo + hi)/2;
  // whatever is in the chamber is held by the extractor and rides back on the bolt face until it clears the port
  if ((S.chambered || S.spent) && !S.feed && S.carrier > EJECT_AT*TRAVEL){ eject(S.chambered); S.chambered = S.spent = false; renderHud(); }
  // feeding round: waits under the feed lips until the bolt face (x = 1.29 - carrier) catches its rim, then is pushed
  // forward, nose climbing the feed ramp, and drops in line with the bore as it enters the chamber
  if (S.feed){
    const fr = parts.feedRound, from = S.feed.from;
    const bx = Math.max(from.x, 1.29 - S.carrier), e = THREE.MathUtils.clamp((bx - from.x)/(1.28 - from.x), 0, 1);
    const lift = THREE.MathUtils.smoothstep(e, 0.05, 0.75);
    fr.visible = true;
    fr.position.set(Math.min(bx, 1.28), from.y + (BORE - from.y)*lift, from.z*(1 - lift));
    fr.rotation.z = -Math.PI/2 + Math.sin(Math.min(1, e*1.3)*Math.PI)*0.22;
    if (e > 0.35) parts.stack.position.y += (0 - parts.stack.position.y) * Math.min(1, dt*14);   // released from the lips: the column pops up
    if (e >= 1 && S.carrier < 0.02) S.feed = null;
  } else { parts.feedRound.visible = false; parts.stack.position.y += (0 - parts.stack.position.y) * Math.min(1, dt*14); }
  fitMagSpring();
  parts.chamberRound.visible = (S.chambered || S.spent) && !S.feed;
  parts.chamberRound.position.x = 1.28 - S.carrier;
  parts.chamberRound.children[1].visible = S.chambered;   // the bullet is gone from a fired case
  // hammer: snaps forward onto the firing-pin head when it falls; the carrier riding back pushes it down again
  S.hammer += ((S.cocked ? 1 : 0) - S.hammer) * Math.min(1, dt*(S.cocked ? 14 : 40));
  const hp = Math.max(S.hammer, THREE.MathUtils.clamp(S.carrier/0.5, 0, 1));
  parts.hammer.rotation.z = parts.HAM_FALL + hp*(parts.HAM_COCK - parts.HAM_FALL);

  parts.drum.rotation.z += (-S.wind*Math.PI/8 - parts.drum.rotation.z) * Math.min(1, dt*16);
  parts.elevScrew.rotation.y += (S.elev*Math.PI/4 - parts.elevScrew.rotation.y) * Math.min(1, dt*16);
  if (S.stockHold && !S.stockHold.done){
    S.stockHold.t += dt; const k = Math.min(1, S.stockHold.t/STOCK_HOLD);
    holdRing.style.setProperty('--p', (k*100).toFixed(0) + '%');
    if (k >= 1){ S.stockHold.done = true; toggleStock(); holdRing.hidden = true; }
  }
  parts.stockLatch.position.z += ((S.stockHold && !S.stockHold.done ? 0.29 : 0.32) - parts.stockLatch.position.z) * Math.min(1, dt*20);   // latch pushed in
  S.flipA += (S.flip - S.flipA) * Math.min(1, dt*14); parts.flip.rotation.z = -S.flipA*Math.PI/2;   // flips forward onto the other leaf
  S.nightA += (S.night - S.nightA) * Math.min(1, dt*14); parts.nightSight.rotation.z = -(1 - S.nightA)*Math.PI/2;   // lies folded forward until raised
  const up = S.held || S.catchPulled ? 1 : 0;
  S.catchUp += (up - S.catchUp) * Math.min(1, dt*25);
  // the catch swings outward about a pivot at the bottom of its arm (top of the paddle comes away from the receiver)
  const ca = -0.38*S.catchUp, cpy = -0.1;
  parts.boltCatch.rotation.x = ca;
  parts.boltCatch.position.set(parts.BC_BASE.x, parts.BC_BASE.y + cpy - cpy*Math.cos(ca), parts.BC_BASE.z - cpy*Math.sin(ca));
  parts.trigger.rotation.z += ((S.trigger ? -0.3 : 0) - parts.trigger.rotation.z) * Math.min(1, dt*30);
  parts.selector.rotation.z += (S.selAng - parts.selector.rotation.z) * Math.min(1, dt*20);
  parts.gas.rotation.x += (S.gasAng - parts.gas.rotation.x) * Math.min(1, dt*12);
  S.gasPush = Math.max(0, S.gasPush - dt); parts.gasDetent.position.z = S.gasPush > 0 ? 0.115 : 0.13;
  for (let i=0;i<4;i++) [S.fold, S.foldV] = spring(S.fold, S.foldV, S.folded ? 1 : 0, 120, 14, dt/4);
  parts.stock.rotation.y = S.fold * Math.PI;
  // bayonet: on the lug, or parked below the barrel when off (hidden on the range)
  S.bay += ((S.bayonet ? 1 : 0) - S.bay) * Math.min(1, dt*10);
  parts.bayonet.visible = S.bay > 0.02;
  const off = 1 - S.bay;
  parts.bayonet.position.set(off*2.2, 0, 0);

  // disassembly: stage 1 runs the field-strip sequence on a linear clock (see CARRIER_STEPS / p.steps); stage 2 strips
  // the carrier group into carrier, bolt, firing pin, cam pin and retaining pin
  S.ex = THREE.MathUtils.clamp(S.ex + (S.disasm ? 1 : -1)*dt/2.6, 0, 1);
  S.ex2 += ((S.disasm === 2 ? 1 : 0) - S.ex2) * Math.min(1, dt*6);
  const ease2 = S.ex2*S.ex2*(3 - 2*S.ex2), shown = stepK(0.88, 1);
  parts.explode.forEach((p, i)=>{
    p.g.position.copy(p.base);
    if (p.stage === 1){ if (p.steps) applySteps(p.g.position, p.steps); p.label.material.opacity = shown; return; }
    p.g.position.addScaledVector(p.off, ease2);
    if (S.disasm) p.g.position.y += Math.sin(t*1.5 + i)*0.03*ease2;
    p.label.material.opacity = ease2 > 0.6 ? (ease2 - 0.6)/0.4 : 0;
  });
  const tilt = -0.33*stepK(0.05, 0.3);
  parts.upper.rotation.z = tilt;                                     // latch pressed: rear lifts, barrel tips down
  // pieces that are out of the upper are laid flat: undo the upper's tilt about their own centre as they settle
  const level = -tilt;
  parts.carrier.rotation.z = level*stepK(0.86, 1);
  parts.hgHalves.forEach(h=>{ h.g.position.set(0, 0, h.sd*0.002); applySteps(h.g.position, h.steps); });
  // sling (①): unhooked first and laid out flat on the left; with the sling taken off (M) it is simply away
  { S.slingA += ((S.sling ? 1 : 0) - S.slingA) * Math.min(1, dt*8);
    const k = stepK(0.0, 0.22), sl = parts.sling, off = 1 - S.slingA;
    sl.visible = S.slingA > 0.02;
    sl.rotation.x = k*Math.PI/2; sl.position.set(0, -1.75*k - off*2.5, -1.15*k - off*1.5); }
  // gas regulator (④): pulled out of the gas block forward, then laid beside the barrel
  { const gm = parts.gasMount; gm.position.set(5.14, 0.64, 0); applySteps(gm.position, [[0.3, 0.42, [0.5, 0, 0]], [0.42, 0.62, [0.3, -0.35, 0.95]]]); }
  parts.labels1.forEach(lb=>lb.material.opacity = shown*(1 - ease2));          // big-assembly names give way to the carrier parts in stage 2
  parts.explode.forEach(p=>{ if (p.stage === 1 && p.g.parent !== parts.carrier) p.g.rotation.z = level*stepK(p.g === parts.recoilSpring.parent ? 0.5 : 0.6, p.g === parts.recoilSpring.parent ? 0.62 : 0.7); });
  controls.target.y += ((S.disasm ? 0.8 : -0.2) - controls.target.y) * Math.min(1, dt*4);

  // magazine: seated, or parked below the rifle when detached (out of sight on the range)
  const magTarget = S.attached ? 0 : (view === 'range' ? 6 : 2.4);
  S.magOut += (magTarget - S.magOut) * Math.min(1, dt*12);
  parts.mag.visible = !!S.mag;
  parts.mag.position.copy(MAG_DIR).multiplyScalar(S.magOut);
  if (!S.attached && view === 'inspect') parts.mag.position.y += Math.sin(t*1.6)*0.05;

  // recoil + muzzle flash
  for (let i=0;i<4;i++){ [S.kick, S.kickV] = spring(S.kick, S.kickV, 0, 900, 30, dt/4); [S.rise, S.riseV] = spring(S.rise, S.riseV, 0, 500, 24, dt/4); }
  rec.position.x = -S.kick*0.075; rec.rotation.z = S.rise*0.026;
  S.flash -= dt;
  const on = S.flash > 0;
  M.flash.opacity = on ? (view === 'range' ? 0.45 : 0.9) : 0; parts.flashLight.intensity = on ? 4 : 0;
  if (on){ parts.flash.rotation.x = Math.random()*Math.PI; parts.flash.scale.setScalar(0.8 + Math.random()*0.5); }

  if (view === 'inspect'){
    holder.position.y = Math.sin(t*1.1)*0.1;
    holder.rotation.y = Math.sin(t*0.4)*0.04;
  } else {
    aimKick *= Math.pow(0.05, dt); camShake *= Math.pow(0.0005, dt);
    aimYaw += (aimYawT - aimYaw) * Math.min(1, dt*10);
    aimPitch += (aimPitchT - aimPitch) * Math.min(1, dt*10);
    aim.rotation.set((Math.random() - 0.5)*0.01*camShake, aimYaw + Math.sin(t*0.9)*0.002 + (Math.random() - 0.5)*0.004*camShake, aimPitch + aimKick + Math.sin(t*1.3)*0.0025);
    camera.position.x = -0.06*camShake;   // the stock punches into the shoulder
  }
  updateCasings(dt);
  if (msgT > 0) msgT -= dt;
  if ((hudT += dt) > 0.2){ hudT = 0; renderHud(); }
  if (view === 'inspect') controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
layoutMag(30);
setView('inspect');
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight || 1.6; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (view === 'inspect') inspectCamera();
});
</script>
