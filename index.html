<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>K2 소총 시뮬레이터</title>
<style>
  :root { --bg1:#ffffff; --bg2:#e7eaef; --fg:#1d2430; --muted:#5b6575; --chip:#ffffffde; --on:#1d2430; --on-fg:#fff; --warn:#c2410c; --ok:#15803d; --fire:#b91c1c; }
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body, button { touch-action:manipulation; }
  html, body { margin:0; height:100%; overflow:hidden; background:#fff; color-scheme:light; }
  body { background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2)); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  body.range { background: linear-gradient(#8dbde6, #dcecf8 60%, #eef4f8); }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
  #ammo { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  #ammo small { font-size:22px; color:var(--muted); font-weight:700; }
  #ammoLbl { font-size:12px; color:var(--muted); margin-top:6px; letter-spacing:.03em; }
  #status { margin-top:8px; font-size:13px; font-weight:700; max-width:56vw; }
  #status.warn { color:var(--warn); } #status.ok { color:var(--ok); }
  #right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  #sel { display:flex; gap:3px; background:var(--chip); padding:4px; border-radius:999px; box-shadow:0 1px 4px rgba(20,30,50,.14); pointer-events:auto; cursor:pointer; }
  #sel span { padding:6px 11px; border-radius:999px; font-size:13px; font-weight:800; color:var(--muted); white-space:nowrap; }
  #sel span.on { background:var(--on); color:var(--on-fg); }
  #sel span.on.safe { background:var(--ok); }
  #score { font-size:13px; font-weight:700; text-align:right; background:var(--chip); padding:6px 12px; border-radius:12px; box-shadow:0 1px 4px rgba(20,30,50,.14); }
  #score[hidden] { display:none; }
  .chip { pointer-events:auto; cursor:pointer; font-size:12px; font-weight:800; background:var(--chip); padding:6px 12px; border-radius:999px; box-shadow:0 1px 4px rgba(20,30,50,.14); }
  #peep { position:fixed; inset:0; pointer-events:none; display:none;
          background: radial-gradient(circle at 50% 50%, transparent 0, transparent 21vmin, rgba(18,20,24,.55) 25vmin, rgba(12,13,16,.94) 31vmin); }
  body.range #peep { display:block; }
  #pop { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); font-size:40px; font-weight:900; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.45); opacity:0; pointer-events:none; }
  #pop.go { animation:pop .8s ease-out; }
  @keyframes pop { 0% { opacity:1; transform:translate(-50%,-30%) scale(1.2); } 70% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-90%) scale(1); } }
  /* view switch (top centre) */
  #viewSeg { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); display:flex; gap:2px; padding:4px;
             background:var(--chip); border-radius:999px; box-shadow:0 1px 6px rgba(20,30,50,.16); backdrop-filter:blur(10px); }
  #viewSeg button { border:0; background:transparent; font:inherit; font-size:13px; font-weight:800; color:var(--muted); padding:8px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  #viewSeg button.on { background:var(--on); color:var(--on-fg); }
  /* tool dock (right edge): action / attachments / view */
  #dock { position:fixed; right:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:4px; padding:8px;
          background:var(--chip); border-radius:18px; box-shadow:0 2px 12px rgba(20,30,50,.16); backdrop-filter:blur(10px);
          max-height:calc(100vh - 250px); overflow-y:auto; scrollbar-width:none; }
  #dock::-webkit-scrollbar { display:none; }
  #dock .grp { font-size:10px; font-weight:800; color:var(--muted); text-align:center; letter-spacing:.06em; margin:4px 0 1px; }
  #dock .grp:first-child { margin-top:0; }
  .tile { width:68px; min-height:50px; border:0; border-radius:12px; background:transparent; cursor:pointer; font:inherit; color:var(--fg);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 2px; }
  .tile b { font-size:12px; font-weight:800; line-height:1.15; text-align:center; }
  .tile kbd { font:600 10px ui-monospace, Consolas, monospace; color:var(--muted); border:1px solid #d5d9e0; border-radius:4px; padding:0 4px; }
  .tile:hover { background:#eef1f5; }
  .tile.on { background:var(--on); color:var(--on-fg); }
  .tile.on kbd { color:#cbd5e1; border-color:#475569; }
  /* fire button (bottom right) */
  #fire { position:fixed; right:22px; bottom:calc(24px + env(safe-area-inset-bottom)); width:86px; height:86px; border-radius:50%; border:0;
          background:var(--fire); color:#fff; font:inherit; font-size:17px; font-weight:900; cursor:pointer;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 6px 18px rgba(185,28,28,.35); }
  #fire kbd { font:600 10px ui-monospace, Consolas, monospace; opacity:.8; }
  #fire:active { transform:scale(.94); }
  #hint { position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:130px; right:130px; text-align:center; font-size:12px; color:var(--muted); pointer-events:none; }
  body.range #hint, body.range #ammoLbl { color:#334155; }
  body.touch kbd { display:none; }
  @media (max-width: 640px) {
    #hud { left:12px; right:12px; }
    #ammo { font-size:34px; } #ammo small { font-size:17px; }
    #status { max-width:48vw; }
    #sel span { padding:5px 8px; font-size:12px; }
    #viewSeg { top:auto; bottom:calc(20px + env(safe-area-inset-bottom)); left:12px; transform:none; }
    #viewSeg button { padding:9px 12px; }
    /* phones: the dock becomes a swipeable row above the view switch, clear of the rifle */
    #dock { top:auto; transform:none; left:8px; right:100px; bottom:calc(76px + env(safe-area-inset-bottom)); flex-direction:row; align-items:center;
            max-height:none; overflow-x:auto; overflow-y:hidden; padding:5px; border-radius:16px; }
    #dock .grp { display:none; }
    .tile { width:auto; min-width:58px; min-height:42px; flex:0 0 auto; padding:4px 8px; }
    .tile b { font-size:12px; white-space:nowrap; }
    .tile b br { display:none; }
    #fire { width:78px; height:78px; right:12px; bottom:calc(20px + env(safe-area-inset-bottom)); }
    #hint { display:none; }
  }
</style>
</head>
<body>
<div id="hud">
  <div>
    <div id="ammo">30<small> + 0</small></div>
    <div id="ammoLbl">탄창 + 약실</div>
    <div id="status"></div>
  </div>
  <div id="right">
    <div id="sel" title="조정간 (Q)"><span>안전</span><span>단발</span><span>연발</span><span>점사</span></div>
    <div id="gasChip" class="chip" title="가스조절기 (G)"></div>
    <div id="score" hidden></div>
  </div>
</div>
<div id="peep"></div>
<div id="pop"></div>
<div id="viewSeg"><button data-v="inspect" class="on">🔍 점검</button><button data-v="range">🎯 사격장</button></div>
<div id="dock">
  <div class="grp">조작</div>
  <button class="tile" id="bCharge"><b>노리쇠</b><kbd>F</kbd></button>
  <button class="tile" id="bMag"><b>탄창 분리</b><kbd>R</kbd></button>
  <button class="tile" id="bNew"><b>새 탄창</b><kbd>N</kbd></button>
  <div class="grp">부착</div>
  <button class="tile" id="bBay"><b>대검</b><kbd>B</kbd></button>
  <button class="tile" id="bStock"><b>개머리판<br>접기</b><kbd>V</kbd></button>
  <div class="grp">보기</div>
  <button class="tile" id="bClear"><b>투명</b><kbd>X</kbd></button>
  <button class="tile" id="bDis"><b>분해</b><kbd>D</kbd></button>
</div>
<button id="fire"><span>발사</span><kbd>Space</kbd></button>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, (innerWidth/innerHeight) || 1.6, 0.05, 2000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 3; controls.maxDistance = 60;

(function buildEnv(){
  const env = new THREE.Scene();
  const skyGeo = new THREE.SphereGeometry(50, 32, 16);
  const cols = [], pos = skyGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const h = THREE.MathUtils.smoothstep(pos.getY(i)/50, -0.4, 0.8);
    const c = new THREE.Color(0x141619).lerp(new THREE.Color(0x8c939e), h);
    cols.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  env.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side:THREE.BackSide, vertexColors:true })));
  const lightMat = new THREE.MeshBasicMaterial({ color:0xffffff });
  [[0,30,0, 30,1,10],[25,10,10, 1,14,20],[-25,8,-8, 1,10,14],[0,6,-28, 18,8,1],[0,18,14, 60,1.2,2],[0,-6,20, 60,0.8,1.5]].forEach(([x,y,z,w,h,d])=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), lightMat); b.position.set(x,y,z); env.add(b);
  });
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3d44, 0.3));
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7); rim.position.set(-12, 8, -14); scene.add(rim);
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(6, 20, 14); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left:-12, right:12, top:12, bottom:-12, near:1, far:60 });
scene.add(key, key.target);

// ---------- materials ----------
// procedural surface textures: parkerized grain on the metal, fine stipple on polymer, checkering on the grip
function noiseTex(base, amp, rep, size=256){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  for (let i=0;i<img.data.length;i+=4){ const v = base + (Math.random()*2-1)*amp; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
}
function checkerTex(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#202020'; g.lineWidth = 3;
  for (let x=-64; x<128; x+=12){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x+64, 64); g.stroke(); g.beginPath(); g.moveTo(x+64, 0); g.lineTo(x, 64); g.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); return t;
}
const parkMap = noiseTex(205, 14, 3), parkBump = noiseTex(128, 90, 6), polyBump = noiseTex(128, 60, 8), gripBump = checkerTex();
parkMap.encoding = THREE.sRGBEncoding;
// "shell" materials go see-through in clear mode; internals keep their own
const M = {
  gun:    new THREE.MeshStandardMaterial({ color:0x5a5d5a, map:parkMap, bumpMap:parkBump, bumpScale:0.0016, roughness:0.5, metalness:0.55, envMapIntensity:0.95 }),   // parkerized receivers
  gunDark:new THREE.MeshStandardMaterial({ color:0x37393b, map:parkMap, bumpMap:parkBump, bumpScale:0.0014, roughness:0.4, metalness:0.7, envMapIntensity:1.1 }), // barrel, gas tube, sights
  poly:   new THREE.MeshPhysicalMaterial({ color:0x09090a, roughness:0.48, clearcoat:0.3, clearcoatRoughness:0.3, bumpMap:polyBump, bumpScale:0.0012, envMapIntensity:0.45 }), // stock, handguard
  gripPoly: new THREE.MeshPhysicalMaterial({ color:0x0c0c0d, roughness:0.6, clearcoat:0.2, clearcoatRoughness:0.5, bumpMap:gripBump, bumpScale:0.012, envMapIntensity:0.5 }),
  mag:    new THREE.MeshStandardMaterial({ color:0x262829, map:parkMap, bumpMap:parkBump, bumpScale:0.0014, roughness:0.45, metalness:0.65, envMapIntensity:0.95 }),
  rubber: new THREE.MeshStandardMaterial({ color:0x0c0c0d, roughness:0.9, bumpMap:polyBump, bumpScale:0.006 }),
  steel:  new THREE.MeshStandardMaterial({ color:0xa7adb5, roughness:0.25, metalness:1, envMapIntensity:1.2 }),
  carrier:new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.3, metalness:1, envMapIntensity:1.2 }),   // carrier body: half see-through in clear mode so the firing pin shows
  dsteel: new THREE.MeshStandardMaterial({ color:0x55595f, roughness:0.32, metalness:1, envMapIntensity:1.1 }),
  spring: new THREE.MeshStandardMaterial({ color:0xc9ced6, roughness:0.25, metalness:1 }),
  follower: new THREE.MeshStandardMaterial({ color:0x4f6b3a, roughness:0.6 }),
  black:  new THREE.MeshBasicMaterial({ color:0x050505 }),
  blade:  new THREE.MeshStandardMaterial({ color:0x34373c, roughness:0.35, metalness:0.85, envMapIntensity:1.1 }),
  grip:   new THREE.MeshStandardMaterial({ color:0x18191b, roughness:0.85 }),
  brass:  new THREE.MeshStandardMaterial({ color:0xd4a64a, roughness:0.22, metalness:1, envMapIntensity:1.2 }),
  copper: new THREE.MeshStandardMaterial({ color:0xb8733a, roughness:0.28, metalness:1 }),
  flash:  new THREE.MeshBasicMaterial({ color:0xffc46b, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }),
};
const SHELL = [[M.gun, 0.16], [M.gunDark, 0.2], [M.poly, 0.14], [M.gripPoly, 0.18], [M.mag, 0.2], [M.rubber, 0.2], [M.grip, 0.3], [M.carrier, 0.38]];
function setClear(on){
  SHELL.forEach(([m, o])=>{ m.transparent = on; m.opacity = on ? o : 1; m.depthWrite = !on; m.side = on ? THREE.DoubleSide : THREE.FrontSide; m.needsUpdate = true; });
  parts.portCover.forEach(o=>o.visible = !on);
}

function shadowed(o){ o.traverse(m=>{ if (m.isMesh){ m.castShadow = true; m.receiveShadow = true; } }); return o; }
function lathe(points, mat, seg=32){ return shadowed(new THREE.Mesh(new THREE.LatheGeometry(points.map(([r,y])=>new THREE.Vector2(r,y)), seg), mat)); }
function rbox(w, h, d, r, mat){
  r = Math.min(r, w/2-0.001, h/2-0.001, d/2-0.001);
  const W = w-2*r, H = h-2*r, c = Math.min(r*0.6, W/2, H/2), x = -W/2, y = -H/2;
  const s = new THREE.Shape();
  s.moveTo(x+c, y); s.lineTo(x+W-c, y); s.quadraticCurveTo(x+W, y, x+W, y+c);
  s.lineTo(x+W, y+H-c); s.quadraticCurveTo(x+W, y+H, x+W-c, y+H);
  s.lineTo(x+c, y+H); s.quadraticCurveTo(x, y+H, x, y+H-c);
  s.lineTo(x, y+c); s.quadraticCurveTo(x, y, x+c, y);
  const g = new THREE.ExtrudeGeometry(s, { depth:Math.max(d-2*r, 0.001), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:6 });
  g.translate(0, 0, -Math.max(d-2*r, 0.001)/2);
  return shadowed(new THREE.Mesh(g, mat));
}
function box(w, h, d, mat){ return shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)); }
function cylX(r, len, mat, seg=24){ const m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat)); m.rotation.z = Math.PI/2; return m; }
function cylY(r, len, mat, seg=24){ return shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat)); }
function cylZ(r, len, mat, seg=24){ const m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat)); m.rotation.x = Math.PI/2; return m; }
function at(parent, obj, x, y, z){ obj.position.set(x, y, z); parent.add(obj); return obj; }
function extrude(shape, depth, mat, bevel=0.02){
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel, bevelSegments:2, curveSegments:24 });
  return shadowed(new THREE.Mesh(g, mat));
}
// side profile (XY) extruded across Z, centred on z=0
function profile(shape, depth, mat, bevel){ const m = extrude(shape, depth, mat, bevel); m.position.z = -depth/2; return m; }
function shape(pts){ const s = new THREE.Shape(); s.moveTo(...pts[0]); pts.slice(1).forEach(p=>p.length === 4 ? s.quadraticCurveTo(...p) : s.lineTo(...p)); return s; }
function spring(pos, vel, target, k, c, dt){ const a = -k*(pos-target) - c*vel; vel += a*dt; pos += vel*dt; return [pos, vel]; }
class Helix extends THREE.Curve {
  constructor(r, n){ super(); this.r = r; this.n = n; }
  getPoint(t, out = new THREE.Vector3()){ const a = t*Math.PI*2*this.n; return out.set(Math.cos(a)*this.r, t, Math.sin(a)*this.r); }
}
// unit-length coil spring along +Y; scale.y sets its length
function coil(r, turns, wire, mat){ return shadowed(new THREE.Mesh(new THREE.TubeGeometry(new Helix(r, turns), turns*16, wire, 6, false), mat)); }
function label(txt, color='#f2f2f2', size=0.13){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d'); g.fillStyle = color; g.font = 'bold 46px "Malgun Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 32, 36);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false }));
}
function tagSprite(txt){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(29,36,48,.88)'; g.beginPath(); g.roundRect ? g.roundRect(4, 8, 248, 48, 24) : g.rect(4, 8, 248, 48); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 30px "Malgun Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 128, 34);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest:false, opacity:0 }));
  sp.scale.set(1.0, 0.25, 1); sp.renderOrder = 10; sp.userData.label = true;
  return sp;
}
function word(txt, color='#e9e9e9', h=0.085){
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const g = cv.getContext('2d'); g.fillStyle = color; g.font = 'bold 44px "Malgun Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 64, 36);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(h*2, h), new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false }));
}
// handguard cross-section: round with deep lengthwise flutes
function fluted(R, depth, n){
  const s = new THREE.Shape(), N = n*16;
  for (let i=0;i<=N;i++){
    const a = i/N*Math.PI*2, r = R - depth*Math.pow(Math.max(0, Math.cos(a*n)), 8);
    i ? s.lineTo(Math.cos(a)*r, Math.sin(a)*r) : s.moveTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  return s;
}
// 5.56 mm cartridge (live = with bullet), base at y=0 pointing +y
function makeRound(live){
  const g = new THREE.Group();
  g.add(lathe([[0,0],[0.052,0],[0.052,0.02],[0.044,0.03],[0.05,0.045],[0.05,0.36],[0.033,0.42],[0.031,0.52],[0,0.52]], M.brass, 16));
  if (live) at(g, lathe([[0,0],[0.029,0],[0.029,0.1],[0.02,0.2],[0.006,0.27],[0,0.28]], M.copper, 16), 0, 0.5, 0);
  return g;
}

// ---------- rifle: dimensions taken from a side photo of the K2 ----------
// muzzle +x, up +y, right side +z; 1 unit ≈ 85 mm, bore line y = 0.38
const SIGHT_Y = 1.02, TRAVEL = 1.0, BORE = 0.38;
const gun = new THREE.Group(), rec = new THREE.Group(); gun.add(rec);
const parts = { portCover:[] };
function tag(obj, part){ obj.traverse(o=>o.userData.part = part); return obj; }

(function buildRifle(){
  // --- upper receiver: raised rear-sight hump, sloped nose, side ledge ---

// magazine contents follow the round count: rounds stacked from the top, follower and spring below
function layoutMag(count){
  const n = Math.min(count, parts.magRounds.length), { MTOP, MBOT, MSTEP } = parts;
  // double stack: rounds alternate sides counted from the bottom, so the top one flips each shot (even count = 우상탄)
  parts.magRounds.forEach((r, i)=>{ r.visible = i < n; r.position.z = (count - i) % 2 === 0 ? 0.05 : -0.05; });
  const fy = MTOP.y - n*MSTEP - 0.05, t = (MTOP.y - fy)/(MTOP.y - MBOT.y);

const _fa = new THREE.Vector3();
function fitMagSpring(){
  const { MBOT } = parts, f = parts.follower, s = parts.magSpring;
  _fa.set(f.position.x + 0.05, f.position.y + parts.stack.position.y - 0.03, 0);
  const bx = MBOT.x + 0.04, by = MBOT.y + 0.03, dx = _fa.x - bx, dy = _fa.y - by;

// ---------- audio ----------
let actx, out;
function ac(){
  if (!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    out = actx.createDynamicsCompressor(); out.threshold.value = -10; out.ratio.value = 6; out.connect(actx.destination);
  }
  return actx;
}
function noiseBuf(dur, curve){
  const a = ac(), len = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (curve ? Math.pow(1-i/len, curve) : 1);
  return buf;
}
function burst({ freq=3000, q=3, vol=0.6, dur=0.03, curve=6, type='bandpass', delay=0, sweep }){
  const a = ac(), t = a.currentTime + delay;
  const src = a.createBufferSource(); src.buffer = noiseBuf(dur, curve);
  const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(out); src.start(t);
}
function tone(freq, vol, dur, type='triangle', delay=0, endFreq){
  const a = ac(), t = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t+dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(out); o.start(t); o.stop(t+dur+0.01);
}
const SND = {
  shot(){ burst({ freq:4000, q:0.4, vol:1, dur:0.05, curve:2, type:'highpass' });

          tone(95, 1, 0.2, 'sine', 0, 38); burst({ freq:900, q:1, vol:0.25, dur:0.6, curve:2, type:'lowpass', delay:0.05, sweep:150 }); },
  bolt(v=0.5){ burst({ freq:1900, q:2, vol:v, dur:0.035 }); tone(620, v*0.3, 0.05, 'square'); },
  click(){ burst({ freq:3600, q:4, vol:0.45, dur:0.02 }); tone(2100, 0.12, 0.03); },
  safe(){ burst({ freq:2500, q:3, vol:0.35, dur:0.025 }); },
  magOut(){ burst({ freq:900, q:1.5, vol:0.5, dur:0.06, curve:4 }); tone(320, 0.2, 0.06, 'square'); },

  clink(v){ tone(4200 + Math.random()*1800, 0.12*v, 0.09, 'sine'); tone(7600 + Math.random()*900, 0.05*v, 0.05, 'sine'); },
  thud(){ burst({ freq:300, q:1, vol:0.5, dur:0.08, curve:4, type:'lowpass' }); },

// selector positions in dial order (clockwise from the muzzle side, seen from the left)
const SEL = ['안전', '단발', '연발', '점사'], SAFE = 0, SEMI = 1, AUTO = 2, BURST = 3;
const S = {
  selector:SAFE, selAng:0, chambered:false, cocked:false, hammer:0,
  mag:{ count:30 }, attached:true, magOut:0, newMag:false,
  carrier:0, carrierV:0, dragging:false, extracted:false, charging:null,
  trigger:false, burst:0, cooldown:0, streak:0,

// strip the top round: it follows the bolt forward into the chamber while the column rises one step
function feedFromMag(){
  const z = S.mag.count % 2 === 0 ? 0.05 : -0.05;              // side of the round on top right now

const casings = [];
// the extractor lets go: the round (live or fired case) flies out of the port from where the bolt face dragged it
function eject(live){
  const r = makeRound(live); shadowed(r);
  r.position.copy(rec.localToWorld(new THREE.Vector3(1.28 - S.carrier, BORE, 0.25)));
  rec.getWorldQuaternion(r.quaternion); r.rotateZ(-Math.PI/2);
  const q = new THREE.Quaternion(); rec.getWorldQuaternion(q);
  const v = new THREE.Vector3(-1.2 + Math.random()*0.8, 3 + Math.random()*1.5, 5.5 + Math.random()*1.5).applyQuaternion(q);
  scene.add(r);
  casings.push({ obj:r, v, w:new THREE.Vector3(Math.random()*20-10, Math.random()*30-15, Math.random()*20-10), life:7, bounces:0 });
  if (casings.length > 60){ const c = casings.shift(); scene.remove(c.obj); }
}
function floorY(){ return view === 'range' ? RANGE_GROUND + 0.05 : ground.position.y + 0.05; }
function updateCasings(dt){
  const fy = floorY();
  for (let i=casings.length-1;i>=0;i--){
    const c = casings[i], o = c.obj;
    c.v.y -= 30*dt; o.position.addScaledVector(c.v, dt);
    o.rotation.x += c.w.x*dt; o.rotation.y += c.w.y*dt; o.rotation.z += c.w.z*dt;
    if (o.position.y < fy){
      o.position.y = fy;
      const sp = Math.abs(c.v.y);
      if (sp > 1.5 && c.bounces < 4){ SND.clink(Math.min(1, sp/8)); c.bounces++; }
      c.v.y = -c.v.y*0.35; c.v.x *= 0.6; c.v.z *= 0.6; c.w.multiplyScalar(0.5);
      if (Math.abs(c.v.y) < 0.5){ c.v.y = 0; c.w.multiplyScalar(0.8); }
    }
    c.life -= dt;
    if (c.life <= 0){ scene.remove(c.obj); casings.splice(i, 1); }

}

// gas settings: 0 shut / 소 less gas (hot weather) / 중 normal / 대 more gas (fouled, cold)
const GAS = ['0 차단', '소 더운 날씨', '중 정상', '대 악조건'], GAS_KICK = [7, 6.3, 7, 8], GAS_RATE = [0.075, 0.085, 0.075, 0.064];
const EJECT_AT = 0.8;    // carrier travel at which the dragged-back case clears the port and is flung out
// hammer falls: fires the chambered round; gas drives the carrier back (extract, eject, re-cock) and the spring
// brings it forward again, stripping the next round into the chamber
function fire(){
  if (!S.cocked) return false;
  S.cocked = false;
  if (!S.chambered){ SND.click(); S.burst = 0; say('딸깍 — 약실이 비었어요'); return false; }
  S.chambered = false; S.spent = true;          // the fired case stays in the chamber until the bolt pulls it out
  SND.shot(); S.flash = 0.05;
  const hot = S.gas === 3;
  S.kickV += GAS_KICK[S.gas]; S.riseV += (S.fold > 0.5 ? 5 : 3.2) * (hot ? 1.15 : 1);
  const rate = GAS_RATE[S.gas];
  if (S.gas === 0){
    // gas shut off: nothing drives the carrier, the empty case stays in the chamber
    S.burst = 0;
    say('가스 차단 — 노리쇠를 손으로 당겨야 해요 (F)');
  } else {
    S.cycle = { t:0, dur:S.clear ? 0.9 : rate*0.85, fed:false };
  }
  S.cooldown = S.clear ? 1.0 : rate; S.streak++;
  if (view === 'range') shootTarget();
  if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) try { navigator.vibrate(25); } catch(e){}
  renderHud();
  return true;
}
function pullTrigger(){
  if (S.trigger) return; S.trigger = true;

  if (S.selector === 0){ SND.safe(); say('안전 상태 — 조정간을 돌리세요 (Q)'); return; }
  if (!S.cocked){ say('공이치기가 풀려 있어요 — 노리쇠를 당기세요 (F)'); return; }
  if (S.cooldown > 0) return;

}

function cycleGas(){

  say(`가스조절기 ${GAS[S.gas]}` + [' — 자동 장전이 안 돼요', ' — 가스 적게, 부드럽고 느리게', '', ' — 가스 많이, 더 빠르고 세게'][S.gas]);
}

  const spread = 0.0012 + Math.min(0.012, S.streak*0.0018);

function setHint(){
  const h = document.getElementById('hint');
  if (view === 'range') h.textContent = TOUCH ? '드래그로 조준 · 빨간 버튼 발사' : '마우스로 조준 · 클릭/Space 발사 · Q 조정간 · F 노리쇠 · R 탄창 · B 대검 · Tab 점검';
  else if (TOUCH) h.textContent = '총을 눌러 방아쇠 · 장전손잡이를 뒤로 끌기 · 탄창/대검/개머리판도 눌러보세요';
  else h.textContent = TOUCH ? '총을 눌러 방아쇠 · 장전손잡이를 뒤로 끌기 · 조정간/탄창/개머리판도 눌러보세요'
                             : '클릭=방아쇠 · 장전손잡이 드래그 · Q 조정간 · F 노리쇠 · R 탄창 · N 새 탄창 · V 개머리판 · B 대검 · G 가스 · D 분해 · X 투명 · Tab 사격장';
}

// ---------- HUD ----------
const ammoEl = document.getElementById('ammo'), ammoLbl = document.getElementById('ammoLbl'), statusEl = document.getElementById('status'),
      selEl = document.getElementById('sel'), scoreEl = document.getElementById('score');
function renderHud(){
  ammoEl.firstChild.nodeValue = S.mag && S.attached ? S.mag.count : '–';
  ammoEl.lastChild.textContent = ` + ${S.chambered ? 1 : 0}`;
  const side = S.mag && S.mag.count > 0 ? ` · ${S.mag.count % 2 === 0 ? '우' : '좌'}상탄` : '';
  ammoLbl.textContent = (S.mag && !S.attached ? `탄창 분리됨 (${S.mag.count}발) + 약실` : '탄창 + 약실') + side;
  [...selEl.children].forEach((s, i)=>{ s.classList.toggle('on', i === S.selector); s.classList.toggle('safe', i === 0); });
  let t, cls = 'warn';
  if (msgT > 0) t = msg;
  else if (S.disasm) t = '분해 상태 — 노리쇠뭉치를 둘러보세요 (D 조립)';
  else if (!S.chambered && !(S.mag && S.attached)) t = '탄창이 분리돼 있어요 — 탄창 결합 (R)';
  else if (S.spent && !S.cycle) t = '약실에 빈 탄피 — 노리쇠를 당기세요 (F)';
  else if (!S.chambered && S.mag.count > 0) t = '약실이 비었어요 — 노리쇠를 당기세요 (F)';
  else if (!S.chambered) t = '탄이 떨어졌어요 — 새 탄창 (N)';
  else if (S.selector === 0) t = '장전 완료 · 안전 — 조정간을 돌리세요 (Q)';
  else { t = `사격 준비 완료 · ${SEL[S.selector]}`; cls = 'ok'; }
  statusEl.textContent = t; statusEl.className = cls;
  scoreEl.textContent = `명중 ${S.hits} / ${S.rangeShots}발 · ${S.points}점`;
  document.querySelector('#bMag b').textContent = S.attached ? '탄창 분리' : '탄창 결합';
  document.getElementById('bMag').classList.toggle('on', !S.attached);
  document.getElementById('bStock').classList.toggle('on', S.folded);
  document.getElementById('bClear').classList.toggle('on', S.clear);
  document.getElementById('gasChip').textContent = `가스 ${GAS[S.gas]}`;
  document.getElementById('bBay').classList.toggle('on', S.bayonet);
  document.querySelector('#bDis b').textContent = S.disasm ? '조립' : '분해';
  document.getElementById('bDis').classList.toggle('on', S.disasm);
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function aimRay(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); }
let active = null, dragPlane = new THREE.Plane(), dragX0 = 0, dragC0 = 0, touchAim = null;
const cvs = renderer.domElement;
// in clear mode clicks should hit the parts you can see, not the glassy shell in front of them
function pickGun(){
  const hits = ray.intersectObject(gun, true).filter(h=>h.object.visible && h.object.material && h.object.material.opacity > 0);
  return hits.find(h=>h.object.userData.part !== 'body') || hits[0];
}
cvs.addEventListener('pointerdown', e=>{
  ac();
  if (view === 'range'){
    cvs.setPointerCapture(e.pointerId);
    if (e.pointerType === 'mouse'){ active = 'trigger'; pullTrigger(); }
    else touchAim = { x:e.clientX, y:e.clientY, yaw:aimYawT, pitch:aimPitchT };
    return;
  }
  aimRay(e);
  const hit = pickGun();
  if (!hit) return;
  controls.enabled = false; cvs.setPointerCapture(e.pointerId);
  const part = hit.object.userData.part;
  if (part === 'handle' && !S.disasm){
    active = 'handle'; S.dragging = true; S.extracted = false; S.cycle = null; S.charging = null;
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), hit.point);
    dragX0 = rec.worldToLocal(hit.point.clone()).x; dragC0 = S.carrier;
  } else if (part === 'selector'){ active = 'ui'; cycleSelector(); }
  else if (part === 'mag'){ active = 'ui'; toggleMag(); }
  else if (part === 'stock'){ active = 'ui'; toggleStock(); }
  else if (part === 'bayonet'){ active = 'ui'; toggleBayonet(); }
  else if (part === 'gas'){ active = 'ui'; cycleGas(); }
  else { active = 'trigger'; pullTrigger(); }
});
cvs.addEventListener('pointermove', e=>{
  if (view === 'range'){
    if (e.pointerType === 'mouse'){
      aimYawT = -(e.clientX/innerWidth*2-1) * 0.28; aimPitchT = -(e.clientY/innerHeight*2-1) * 0.16;
    } else if (touchAim){
      aimYawT = THREE.MathUtils.clamp(touchAim.yaw - (e.clientX - touchAim.x)/innerWidth * 0.5, -0.35, 0.35);
      aimPitchT = THREE.MathUtils.clamp(touchAim.pitch - (e.clientY - touchAim.y)/innerHeight * 0.35, -0.2, 0.2);
    }
    return;
  }
  if (active === 'handle'){
    aimRay(e);
    if (ray.ray.intersectPlane(dragPlane, tmpA)){
      const x = rec.worldToLocal(tmpA.clone()).x;
      S.carrier = THREE.MathUtils.clamp(dragC0 - (x - dragX0), 0, TRAVEL);
      if (S.carrier > TRAVEL*0.92) chargeExtract();
    }
    return;
  }
  if (!active){
    aimRay(e);
    const hit = pickGun(), p = hit && hit.object.userData.part;
    cvs.style.cursor = !hit ? 'grab' : p === 'handle' ? 'ew-resize' : 'pointer';
  }
});
function endPointer(){
  if (active === 'trigger') releaseTrigger();
  if (active === 'handle') chargeRelease();
  active = null; touchAim = null;
  if (view === 'inspect') controls.enabled = true;
}
cvs.addEventListener('pointerup', endPointer);
cvs.addEventListener('pointercancel', endPointer);

const fireBtn = document.getElementById('fire');
fireBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); ac(); fireBtn.setPointerCapture(e.pointerId); pullTrigger(); });
fireBtn.addEventListener('pointerup', releaseTrigger);
fireBtn.addEventListener('pointercancel', releaseTrigger);
document.getElementById('bCharge').onclick = ()=>{ ac(); chargeAuto(); };
document.getElementById('bMag').onclick = ()=>{ ac(); toggleMag(); };
document.getElementById('bNew').onclick = ()=>{ ac(); newMag(); };
document.getElementById('bStock').onclick = ()=>{ ac(); toggleStock(); };
document.getElementById('bClear').onclick = toggleClear;
document.getElementById('gasChip').onclick = ()=>{ ac(); cycleGas(); };
document.getElementById('bBay').onclick = ()=>{ ac(); toggleBayonet(); };
document.getElementById('bDis').onclick = ()=>{ ac(); toggleDisasm(); };
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick = ()=>setView(b.dataset.v));
[...selEl.children].forEach((s, i)=>s.onclick = ()=>{ ac(); setSelector(i); });

addEventListener('keydown', e=>{
  if (e.repeat){ if (e.code === 'Space') e.preventDefault(); return; }
  ac();
  switch (e.code){
    case 'Space': e.preventDefault(); pullTrigger(); break;
    case 'KeyQ': cycleSelector(); break;
    case 'KeyF': chargeAuto(); break;
    case 'KeyR': toggleMag(); break;
    case 'KeyN': newMag(); break;
    case 'KeyV': toggleStock(); break;
    case 'KeyX': toggleClear(); break;
    case 'KeyB': toggleBayonet(); break;
    case 'KeyG': cycleGas(); break;
    case 'KeyD': toggleDisasm(); break;
    case 'Tab': e.preventDefault(); setView(view === 'range' ? 'inspect' : 'range'); break;
  }
});
addEventListener('keyup', e=>{ if (e.code === 'Space'){ e.preventDefault(); releaseTrigger(); } });
addEventListener('contextmenu', e=>e.preventDefault());
['gesturestart', 'gesturechange'].forEach(t=>document.addEventListener(t, e=>e.preventDefault()));
document.addEventListener('dblclick', e=>e.preventDefault(), { passive:false });

// ---------- loop ----------
const clock = new THREE.Clock();
const MAG_DIR = new THREE.Vector3(0.12, -1, 0).normalize();
const PORT0 = 0.025, PORT1 = 0.875;     // ejection port span (x)
let hudT = 0;
function animate(){
  const dt = Math.min(clock.getDelta(), 1/30), t = clock.elapsedTime;

  // burst / automatic fire
  S.cooldown -= dt;
  if (S.cooldown <= 0){
    if (S.burst > 0){ S.burst--; fire(); }
    else if (S.selector === AUTO && S.trigger && S.chambered && S.cocked) fire();
  }
  if (S.cycle){
    // gas cycle: carrier slams back (decelerating against the spring), then the spring drives it home
    const c = S.cycle; c.t += dt;
    const u = c.t/c.dur, BACK = 0.4;
    if (u < BACK){ const k = u/BACK; S.carrier = TRAVEL*(1 - (1 - k)*(1 - k)); }
    else {
      if (!c.fed){ c.fed = true; SND.bolt(0.25); if (canFeed()) feedFromMag(); }
      const k = Math.min(1, (u - BACK)/(1 - BACK)); S.carrier = TRAVEL*(1 - k*k);
    }
    if (u >= 1){ S.carrier = 0; S.carrierV = 0; S.cycle = null; }
  } else if (S.charging){
    // manual charge (F / button): slower in clear view so the feed can be followed
    const back = S.clear ? 0.5 : 0.16;
    S.charging.t += dt;
    S.carrier = Math.min(TRAVEL, S.charging.t/back*TRAVEL);
    if (S.carrier >= TRAVEL){ chargeExtract(); if (S.charging.t > back + 0.1){ S.charging = null; chargeRelease(); } }
  } else if (!S.dragging){
    const k = S.clear ? 140 : 1600;   // slow motion in clear view
    for (let i=0;i<4;i++) [S.carrier, S.carrierV] = spring(S.carrier, S.carrierV, 0, k, 2*Math.sqrt(k)*1.05, dt/4);
    if (S.carrier < 0) S.carrier = 0;
  }
  if (S.carrier > 0.3) S.cocked = true;
  if (S.ex > 0.05) S.carrier = 0;
  parts.carrier.position.x = -S.carrier;
  // recoil spring compresses as the carrier comes back (supporter front x=-1.06 to the rear face of the carrier lug x=0.12)
  parts.recoilSpring.scale.y = Math.max(0.12, 1.18 - S.carrier);
  // bolt strip in the port (opaque mode): the part of the carrier/bolt (x 0.12…1.29) that is behind the port
  const b0 = 0.12 - S.carrier, b1 = 1.29 - S.carrier, lo = Math.max(b0, PORT0), hi = Math.min(b1, PORT1);
  parts.bolt.visible = !S.clear && hi > lo && S.ex < 0.05; parts.bolt.scale.x = Math.max(0.001, (hi - lo)/0.85); parts.bolt.position.x = (lo + hi)/2;
  // whatever is in the chamber is held by the extractor and rides back on the bolt face until it clears the port
  if ((S.chambered || S.spent) && !S.feed && S.carrier > EJECT_AT*TRAVEL){ eject(S.chambered); S.chambered = S.spent = false; renderHud(); }
  // feeding round: waits under the feed lips until the bolt face (x = 1.29 - carrier) catches its rim, then is pushed
  // forward, nose climbing the feed ramp, and drops in line with the bore as it enters the chamber
  if (S.feed){
    const fr = parts.feedRound, from = S.feed.from;
    const bx = Math.max(from.x, 1.29 - S.carrier), e = THREE.MathUtils.clamp((bx - from.x)/(1.28 - from.x), 0, 1);
    const lift = THREE.MathUtils.smoothstep(e, 0.05, 0.75);
    fr.visible = true;
    fr.position.set(Math.min(bx, 1.28), from.y + (BORE - from.y)*lift, from.z*(1 - lift));
    fr.rotation.z = -Math.PI/2 + Math.sin(Math.min(1, e*1.3)*Math.PI)*0.22;
    if (e > 0.35) parts.stack.position.y += (0 - parts.stack.position.y) * Math.min(1, dt*14);   // released from the lips: the column pops up
    if (e >= 1 && S.carrier < 0.02) S.feed = null;
  } else { parts.feedRound.visible = false; parts.stack.position.y += (0 - parts.stack.position.y) * Math.min(1, dt*14); }
  fitMagSpring();
  parts.chamberRound.visible = (S.chambered || S.spent) && !S.feed;
  parts.chamberRound.position.x = 1.28 - S.carrier;
  parts.chamberRound.children[1].visible = S.chambered;   // the bullet is gone from a fired case
  // hammer: snaps forward onto the firing-pin head when it falls; the carrier riding back pushes it down again
  S.hammer += ((S.cocked ? 1 : 0) - S.hammer) * Math.min(1, dt*(S.cocked ? 14 : 40));
  const hp = Math.max(S.hammer, THREE.MathUtils.clamp(S.carrier/0.5, 0, 1));
  parts.hammer.rotation.z = parts.HAM_FALL + hp*(parts.HAM_COCK - parts.HAM_FALL);

  parts.trigger.rotation.z += ((S.trigger ? -0.3 : 0) - parts.trigger.rotation.z) * Math.min(1, dt*30);
  parts.selector.rotation.z += (S.selAng - parts.selector.rotation.z) * Math.min(1, dt*20);
  const ga = parts.GAS_ANG[S.gas]; parts.gas.rotation.x += (ga - parts.gas.rotation.x) * Math.min(1, dt*16);
  for (let i=0;i<4;i++) [S.fold, S.foldV] = spring(S.fold, S.foldV, S.folded ? 1 : 0, 120, 14, dt/4);
  parts.stock.rotation.y = S.fold * Math.PI;
  // bayonet: on the lug, or parked below the barrel when off (hidden on the range)
  S.bay += ((S.bayonet ? 1 : 0) - S.bay) * Math.min(1, dt*10);
  parts.bayonet.visible = S.bay > 0.02;
  const off = 1 - S.bay;
  parts.bayonet.position.set(off*2.2, 0, 0);

  // disassembly: lift every bolt-group piece out to its own spot
  S.ex += ((S.disasm ? 1 : 0) - S.ex) * Math.min(1, dt*6);
  const ease = S.ex*S.ex*(3 - 2*S.ex);
  parts.explode.forEach((p, i)=>{
    p.g.position.copy(p.base).addScaledVector(p.off, ease);
    if (S.disasm) p.g.position.y += Math.sin(t*1.5 + i)*0.03*ease;
    p.label.material.opacity = ease > 0.6 ? (ease - 0.6)/0.4 : 0;
  });
  parts.upper.rotation.z = -0.33*ease;   // rear lifts, barrel tips down
  controls.target.y += ((S.disasm ? 1.0 : -0.2) - controls.target.y) * Math.min(1, dt*4);

  // magazine: seated, or parked below the rifle when detached (out of sight on the range)
  const magTarget = S.attached ? 0 : (view === 'range' ? 6 : 2.4);
  S.magOut += (magTarget - S.magOut) * Math.min(1, dt*12);
  parts.mag.visible = !!S.mag;
  parts.mag.position.copy(MAG_DIR).multiplyScalar(S.magOut);
  if (!S.attached && view === 'inspect') parts.mag.position.y += Math.sin(t*1.6)*0.05;

  // recoil + muzzle flash
  for (let i=0;i<4;i++){ [S.kick, S.kickV] = spring(S.kick, S.kickV, 0, 900, 30, dt/4); [S.rise, S.riseV] = spring(S.rise, S.riseV, 0, 500, 24, dt/4); }
  rec.position.x = -S.kick*0.06; rec.rotation.z = S.rise*0.02;
  S.flash -= dt;
  const on = S.flash > 0;
  M.flash.opacity = on ? (view === 'range' ? 0.45 : 0.9) : 0; parts.flashLight.intensity = on ? 4 : 0;
  if (on){ parts.flash.rotation.x = Math.random()*Math.PI; parts.flash.scale.setScalar(0.8 + Math.random()*0.5); }

  if (view === 'inspect'){
    holder.position.y = Math.sin(t*1.1)*0.1;
    holder.rotation.y = Math.sin(t*0.4)*0.04;
  } else {
    aimKick *= Math.pow(0.02, dt);
    aimYaw += (aimYawT - aimYaw) * Math.min(1, dt*10);
    aimPitch += (aimPitchT - aimPitch) * Math.min(1, dt*10);
    aim.rotation.set(0, aimYaw + Math.sin(t*0.9)*0.002, aimPitch + aimKick + Math.sin(t*1.3)*0.0025);
  }
  updateCasings(dt);
  if (msgT > 0) msgT -= dt;
  if ((hudT += dt) > 0.2){ hudT = 0; renderHud(); }
  if (view === 'inspect') controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
layoutMag(30);
setView('inspect');
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight || 1.6; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (view === 'inspect') inspectCamera();
});
</script>
</body>
</html>
